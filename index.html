<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>링크코드</title>
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf8; --ink:#14213d; --sub:#5b6378; --line:#e3ddd0;
    --accent:#e4572e; --accent-ink:#fff; --ok:#2a9d8f; --key:#efe9dc;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1524; --card:#171f33; --ink:#f1ede4; --sub:#9aa3b8; --line:#2a3450;
           --accent:#ff7a50; --accent-ink:#1a0e08; --ok:#4fd1c0; --key:#222c45; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px;min-height:100dvh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
  .brand b{color:var(--accent)}
  .tabs{display:flex;background:var(--key);border-radius:999px;padding:4px}
  .tabs button{border:0;background:none;color:var(--sub);font:inherit;font-weight:700;
    padding:9px 18px;border-radius:999px;cursor:pointer;font-size:15px}
  .tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
  .hidden{display:none!important}
  h2{margin:0 0 6px;font-size:20px}
  p.hint{margin:0 0 18px;color:var(--sub);font-size:14px;line-height:1.5}

  /* 받기 */
  .slots{display:flex;gap:10px;justify-content:center;margin:8px 0 22px}
  .slot{width:min(14vw,64px);height:min(18vw,80px);border-radius:14px;border:2px solid var(--line);
    display:grid;place-items:center;font-size:min(10vw,44px);font-weight:800;font-variant-numeric:tabular-nums;background:var(--bg)}
  .slot.on{border-color:var(--accent)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pad button{border:0;background:var(--key);color:var(--ink);font:inherit;font-size:30px;font-weight:700;
    height:72px;border-radius:16px;cursor:pointer;touch-action:manipulation}
  .pad button:active{transform:scale(.96)}
  .pad .fn{font-size:17px;color:var(--sub)}
  .msg{min-height:24px;text-align:center;margin-top:14px;font-weight:700}
  .msg.err{color:var(--accent)} .msg.ok{color:var(--ok)}

  /* 보내기 */
  textarea{width:100%;min-height:96px;resize:vertical;border:2px solid var(--line);border-radius:14px;
    padding:12px 14px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
  textarea:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px;margin-top:12px}
  .btn{flex:1;border:0;border-radius:14px;padding:16px;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
  .btn.main{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:var(--key);color:var(--ink);flex:0 0 auto;padding:16px 18px}
  .btn:disabled{opacity:.5}
  .result{text-align:center;padding:10px 0 0}
  .big{font-size:min(17vw,76px);font-weight:900;letter-spacing:.12em;font-variant-numeric:tabular-nums;margin:8px 0 2px}
  .result small{color:var(--sub);font-size:14px}
  .shorturl{margin-top:14px;padding:12px;border-radius:12px;background:var(--bg);font-size:15px;word-break:break-all}
  footer{margin-top:auto;padding-top:24px;text-align:center;color:var(--sub);font-size:13px;line-height:1.6}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">링크<b>코드</b></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-recv" aria-selected="true">받기</button>
      <button role="tab" id="tab-send" aria-selected="false">보내기</button>
    </div>
  </header>

  <!-- 받기: 전자칠판 -->
  <section id="recv" class="card">
    <h2>코드 6자리 입력</h2>
    <p class="hint">폰에서 받은 숫자를 누르면 바로 열립니다.</p>
    <div class="slots" id="slots"></div>
    <div class="pad" id="pad"></div>
    <div class="msg" id="recvMsg"></div>
  </section>

  <!-- 보내기: 폰 -->
  <section id="send" class="card hidden">
    <h2>링크 보내기</h2>
    <p class="hint">긴 주소를 붙여넣으면 6자리 코드가 나옵니다. 코드는 30분 동안 유효합니다.</p>
    <textarea id="urlInput" placeholder="https://..." inputmode="url" autocomplete="off"></textarea>
    <div class="row">
      <button class="btn ghost" id="pasteBtn">붙여넣기</button>
      <button class="btn main" id="makeBtn">코드 만들기</button>
    </div>
    <div class="msg" id="sendMsg"></div>
    <div class="result hidden" id="result">
      <div class="big" id="codeOut">------</div>
      <small id="timer"></small>
      <div class="shorturl">칠판 주소창에 바로 입력해도 열립니다<br><b id="shortOut"></b></div>
    </div>
  </section>

  <footer>로그인 없이 작동합니다 · 링크는 30분 뒤 자동 삭제</footer>
</main>

<script>
const $ = s => document.querySelector(s);
const host = location.host;

/* ---------- 탭 ---------- */
function show(which){
  $("#recv").classList.toggle("hidden", which !== "recv");
  $("#send").classList.toggle("hidden", which !== "send");
  $("#tab-recv").setAttribute("aria-selected", which === "recv");
  $("#tab-send").setAttribute("aria-selected", which === "send");
}
$("#tab-recv").onclick = () => show("recv");
$("#tab-send").onclick = () => show("send");

/* ---------- 받기 ---------- */
let digits = "";
const slots = $("#slots");
for (let i = 0; i < 6; i++) slots.appendChild(Object.assign(document.createElement("div"), {className:"slot"}));
const keys = ["1","2","3","4","5","6","7","8","9","지움","0","←"];
for (const k of keys){
  const b = document.createElement("button");
  b.textContent = k;
  if (k.length > 1) b.className = "fn";
  b.onclick = () => press(k);
  $("#pad").appendChild(b);
}
function render(){
  [...slots.children].forEach((s,i)=>{ s.textContent = digits[i] || ""; s.classList.toggle("on", i === digits.length); });
}
function setMsg(el, text, kind){ el.textContent = text; el.className = "msg " + (kind || ""); }

function press(k){
  if (k === "지움") digits = "";
  else if (k === "←") digits = digits.slice(0, -1);
  else if (digits.length < 6) digits += k;
  setMsg($("#recvMsg"), "");
  render();
  if (digits.length === 6) openCode(digits);
}
document.addEventListener("keydown", e => {
  if ($("#recv").classList.contains("hidden")) return;
  if (/^\d$/.test(e.key)) press(e.key);
  else if (e.key === "Backspace") press("←");
  else if (e.key === "Escape") press("지움");
});

async function openCode(code){
  setMsg($("#recvMsg"), "여는 중…");
  try {
    const r = await fetch("/api/open?code=" + code);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    setMsg($("#recvMsg"), "열립니다", "ok");
    location.href = d.url;
  } catch (e) {
    setMsg($("#recvMsg"), e.message || "열 수 없습니다", "err");
    digits = ""; render();
  }
}

/* ---------- 보내기 ---------- */
let timerId;
$("#pasteBtn").onclick = async () => {
  try { $("#urlInput").value = await navigator.clipboard.readText(); }
  catch { $("#urlInput").focus(); setMsg($("#sendMsg"), "길게 눌러 붙여넣어 주세요", "err"); }
};
$("#makeBtn").onclick = () => makeCode($("#urlInput").value);

function extractUrl(text){
  const m = String(text || "").match(/https?:\/\/[^\s]+/i);
  return m ? m[0] : String(text || "").trim();
}

async function makeCode(raw){
  const url = extractUrl(raw);
  if (!url) return setMsg($("#sendMsg"), "링크를 넣어 주세요", "err");
  $("#makeBtn").disabled = true;
  setMsg($("#sendMsg"), "만드는 중…");
  try {
    const r = await fetch("/api/create", {
      method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({url})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    setMsg($("#sendMsg"), "");
    $("#codeOut").textContent = d.code;
    $("#shortOut").textContent = host + "/" + d.code;
    $("#result").classList.remove("hidden");
    startTimer(d.expiresIn);
  } catch (e) {
    setMsg($("#sendMsg"), e.message || "실패했습니다", "err");
  } finally {
    $("#makeBtn").disabled = false;
  }
}
function startTimer(sec){
  clearInterval(timerId);
  const end = Date.now() + sec * 1000;
  const tick = () => {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    $("#timer").textContent = left ? `${Math.floor(left/60)}분 ${String(left%60).padStart(2,"0")}초 남음` : "만료되었습니다";
    if (!left) clearInterval(timerId);
  };
  tick(); timerId = setInterval(tick, 1000);
}

/* ---------- 시작 화면 결정 ---------- */
const q = new URLSearchParams(location.search);
const shared = q.get("url") || q.get("text") || q.get("title"); // 폰 '공유' 메뉴로 들어온 경우
if (shared) {
  show("send");
  $("#urlInput").value = extractUrl(shared);
  history.replaceState(null, "", "/");
  makeCode(shared);
} else if (q.get("notfound")) {
  setMsg($("#recvMsg"), "없거나 만료된 코드입니다", "err");
  history.replaceState(null, "", "/");
} else if (matchMedia("(pointer:coarse)").matches && innerWidth < 700) {
  show("send"); // 작은 터치 화면(폰)은 보내기부터
}
render();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
</html>
